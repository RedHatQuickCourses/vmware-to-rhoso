---
# Main playbook for setting up VM Migration with Ansible Automation Platform
# This playbook automates the following documentation:
# 1. install-aap-configure.adoc - Install and configure AAP
# 2. ansible-builder.adoc - Build execution environment
# 3. migrate-vm-with-aap.adoc - Configure AAP for VM migration
#
# Usage:
#   ansible-playbook -i inventory/hosts-<guid>.yml migration-setup.yml
#
# To run specific parts only, use tags:
#   ansible-playbook -i inventory/hosts-<guid>.yml migration-setup.yml --tags install-aap
#   ansible-playbook -i inventory/hosts-<guid>.yml migration-setup.yml --tags ansible-builder
#   ansible-playbook -i inventory/hosts-<guid>.yml migration-setup.yml --tags configure-migration

- name: Install and Configure Ansible Automation Platform
  hosts: bastion
  become: false
  gather_facts: true
  vars_files:
    - vars/main.yml
    - vars/migration.yml
  roles:
    - install-aap
  tags:
    - install-aap
    - aap

- name: Build VMware Migration Toolkit Execution Environment
  hosts: bastion
  become: false
  gather_facts: true
  vars_files:
    - vars/main.yml
    - vars/migration.yml
  roles:
    - ansible-builder
  tags:
    - ansible-builder
    - builder
    - execution-environment

- name: Configure AAP for VM Migration (generate config files)
  hosts: bastion
  become: false
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/migration.yml
  roles:
    - configure-aap-migration
  tags:
    - configure-migration
    - migration-config

- name: Configure AAP via API (automated setup)
  hosts: bastion
  become: false
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/migration.yml
  tasks:
    - name: Include configure-aap-api role
      include_role:
        name: configure-aap-api
      when: configure_aap_via_api | default(true)
  tags:
    - configure-aap-api
    - aap-api
    - api-config

- name: Display completion summary
  hosts: bastion
  become: false
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/migration.yml
  tasks:
    - name: Show final instructions (API configured)
      debug:
        msg: |
          ========================================
          🎉 VM Migration Setup Complete!
          ========================================
          
          What was configured:
          ✅ Ansible Automation Platform installed (17+ pods running)
          ✅ VMware Migration Toolkit Execution Environment built and pushed
          ✅ Migration configuration files created
          ✅ AAP configured via API:
             - Credentials (SSH key)
             - Inventory (Conversion Host)
             - Project (synced from GitHub)
             - Job Template (ready to launch)
          
          🚀 Ready to Migrate!
          ========================================
          The job template "Windows VM Migration" has been created and is ready to use.
          
          Access AAP and launch migration:
          1. Open AAP Dashboard (URL shown in configure-aap-api output)
          2. Navigate to: Resources → Templates
          3. Find: "Windows VM Migration"
          4. Click: Launch 🚀
          
          The migration will start immediately!
          ========================================
      when: configure_aap_via_api | default(true)

    - name: Show final instructions (manual configuration)
      debug:
        msg: |
          ========================================
          VM Migration Setup Complete!
          ========================================
          
          What was configured:
          1. ✓ Ansible Automation Platform installed
          2. ✓ VMware Migration Toolkit Execution Environment built and pushed
          3. ✓ Migration configuration files created
          
          Next Steps (Manual AAP Configuration Required):
          1. Access AAP Dashboard at: {{ aap_dashboard_url | default('Check AAP route') }}
             Username: admin
             Password: (Retrieved from secret)
          
          2. Follow the instructions in:
             {{ ansible_env.HOME }}/{{ migration_config_dir }}/AAP_CONFIGURATION_INSTRUCTIONS.txt
          
          3. Configuration file for AAP job template:
             {{ ansible_env.HOME }}/{{ migration_config_dir }}/os_migrate_for_aap.yaml
          
          ========================================
      when: not (configure_aap_via_api | default(true))
  tags:
    - always

