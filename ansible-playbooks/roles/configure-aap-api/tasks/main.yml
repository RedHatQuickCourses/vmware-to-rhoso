---
# Configure AAP via REST API for VM Migration
# Uses direct API calls instead of awx.awx collection for better compatibility

# Step 0: Get AAP credentials and connection info
- name: Get AAP admin password from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ aap_instance_name }}-admin-password"
    namespace: "{{ aap_namespace }}"
  register: aap_admin_secret

- name: Decode AAP admin password
  set_fact:
    aap_admin_password: "{{ aap_admin_secret.resources[0].data.password | b64decode }}"
  when: aap_admin_secret.resources | length > 0

- name: Get AAP Controller route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ aap_namespace }}"
  register: aap_routes

- name: Extract AAP Controller URL
  set_fact:
    aap_controller_url: "https://{{ (aap_routes.resources | selectattr('metadata.name', 'match', '.*controller.*') | list | first).spec.host }}"
  when: aap_routes.resources | length > 0

- name: Wait for AAP Controller API to be ready
  uri:
    url: "{{ aap_controller_url }}/api/v2/ping/"
    method: GET
    validate_certs: false
    status_code: 200
  register: aap_ping
  until: aap_ping.status == 200
  retries: 30
  delay: 10

# Step 0.5: Create OAuth2 token using awx-manage (the only reliable way)
- name: Create OAuth2 token via awx-manage
  ansible.builtin.shell: |
    oc exec -n {{ aap_namespace }} \
      deployment/{{ aap_instance_name }}-controller-web -- \
      awx-manage create_oauth2_token --user admin
  register: token_result
  changed_when: true

- name: Set API token
  set_fact:
    aap_api_token: "{{ token_result.stdout | trim }}"

- name: Display token info
  debug:
    msg: |
      ✅ OAuth2 token created via awx-manage
      AAP Controller URL: {{ aap_controller_url }}
      Token: {{ aap_api_token[:20] }}...

# Step 1: Get organization ID
- name: Get Default organization
  uri:
    url: "{{ aap_controller_url }}/api/v2/organizations/?name=Default"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: org_result

- name: Set organization ID
  set_fact:
    org_id: "{{ org_result.json.results[0].id }}"

# Step 1.5: Get AAP Hub registry URL for execution environment
- name: Get AAP Hub route for registry
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ aap_namespace }}"
  register: aap_hub_route

- name: Extract AAP Hub registry URL
  set_fact:
    aap_hub_registry_url: "{{ item.spec.host }}"
  when: 
    - "'hub' in item.metadata.name"
    - "'hub-web-svc' in item.spec.to.name"
  loop: "{{ aap_hub_route.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# Step 2: Get credential type ID for Machine
- name: Get Machine credential type
  uri:
    url: "{{ aap_controller_url }}/api/v2/credential_types/?name=Machine"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: cred_type_result

- name: Set credential type ID
  set_fact:
    machine_cred_type_id: "{{ cred_type_result.json.results[0].id }}"

# Step 3: Read SSH key and create credential
- name: Read SSH private key content
  slurp:
    src: "/home/lab-user/.ssh/{{ guid }}key.pem"
  register: ssh_key_content

- name: Check if Bastion key credential exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/credentials/?name=Bastion%20key"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_credential

- name: Create Bastion SSH Credential
  uri:
    url: "{{ aap_controller_url }}/api/v2/credentials/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Bastion key"
      description: "SSH key for bastion access"
      organization: "{{ org_id }}"
      credential_type: "{{ machine_cred_type_id }}"
      inputs:
        username: "cloud-user"
        ssh_key_data: "{{ ssh_key_content.content | b64decode }}"
    validate_certs: false
    status_code: [201]
  register: credential_result
  when: existing_credential.json.count == 0

- name: Set credential ID
  set_fact:
    credential_id: "{{ credential_result.json.id | default(existing_credential.json.results[0].id) }}"

- name: Display credential result
  debug:
    msg: "✅ Bastion credential ID: {{ credential_id }}"

# Step 4: Create Inventory
- name: Check if inventory exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/inventories/?name=Conversion%20Host%20Inventory"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_inventory

- name: Create Conversion Host Inventory
  uri:
    url: "{{ aap_controller_url }}/api/v2/inventories/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Conversion Host Inventory"
      description: "Inventory for VM migration conversion hosts"
      organization: "{{ org_id }}"
    validate_certs: false
    status_code: [201]
  register: inventory_result
  when: existing_inventory.json.count == 0

- name: Set inventory ID
  set_fact:
    inventory_id: "{{ inventory_result.json.id | default(existing_inventory.json.results[0].id) }}"

- name: Display inventory result
  debug:
    msg: "✅ Inventory ID: {{ inventory_id }}"

# Step 5: Create hosts
- name: Check if conversion_host exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/hosts/?name=conversion_host&inventory={{ inventory_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_conv_host

- name: Create conversion_host
  uri:
    url: "{{ aap_controller_url }}/api/v2/hosts/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "conversion_host"
      description: "OpenStack conversion host"
      inventory: "{{ inventory_id }}"
      variables: "ansible_host: {{ rhoso_conversion_host_ip }}\nansible_ssh_user: cloud-user"
    validate_certs: false
    status_code: [201]
  when: existing_conv_host.json.count == 0

- name: Check if migrator host exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/hosts/?name=migrator&inventory={{ inventory_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_migrator

- name: Create migrator host
  uri:
    url: "{{ aap_controller_url }}/api/v2/hosts/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "migrator"
      description: "Local migration orchestrator"
      inventory: "{{ inventory_id }}"
      variables: "ansible_connection: local\nansible_python_interpreter: '{{ '{{' }} ansible_playbook_python {{ '}}' }}'"
    validate_certs: false
    status_code: [201]
  when: existing_migrator.json.count == 0

- name: Display hosts result
  debug:
    msg: "✅ Hosts created: conversion_host ({{ rhoso_conversion_host_ip }}), migrator"

# Step 6: Create Execution Environment
- name: Check if execution environment exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/execution_environments/?name=VMware%20Migration%20toolkit%20execution%20environment"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_ee

- name: Create Execution Environment
  uri:
    url: "{{ aap_controller_url }}/api/v2/execution_environments/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "VMware Migration toolkit execution environment"
      description: "Execution environment for VMware to RHOSO migration"
      image: "{{ aap_hub_registry_url }}/{{ ee_image_name }}:{{ ee_image_tag }}"
      organization: "{{ org_id }}"
    validate_certs: false
    status_code: [201]
  register: ee_result
  when: existing_ee.json.count == 0

- name: Set execution environment ID
  set_fact:
    ee_id: "{{ ee_result.json.id | default(existing_ee.json.results[0].id) }}"

- name: Display EE result
  debug:
    msg: "✅ Execution Environment ID: {{ ee_id }}"

# Step 7: Create Project
- name: Check if project exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/projects/?name=vmware%20migration%20toolkit%20project"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_project

- name: Create Project
  uri:
    url: "{{ aap_controller_url }}/api/v2/projects/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "vmware migration toolkit project"
      description: "VMware to RHOSO migration toolkit"
      organization: "{{ org_id }}"
      scm_type: "git"
      scm_url: "https://github.com/os-migrate/vmware-migration-kit"
      scm_update_on_launch: true
      default_environment: "{{ ee_id }}"
    validate_certs: false
    status_code: [201]
  register: project_result
  when: existing_project.json.count == 0

- name: Set project ID
  set_fact:
    project_id: "{{ project_result.json.id | default(existing_project.json.results[0].id) }}"

- name: Display project result
  debug:
    msg: "✅ Project ID: {{ project_id }}"

- name: Wait for project sync (60 seconds max)
  uri:
    url: "{{ aap_controller_url }}/api/v2/projects/{{ project_id }}/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: project_status
  until: project_status.json.status in ['successful', 'failed', 'never updated']
  retries: 12
  delay: 5
  ignore_errors: true

# Step 8: Read migration configuration and create Job Template
- name: Get home directory
  shell: echo $HOME
  register: home_dir
  changed_when: false

- name: Check if migration configuration file exists
  stat:
    path: "{{ home_dir.stdout }}/{{ migration_config_dir }}/os_migrate_for_aap.yaml"
  register: migration_config_file

- name: Read migration configuration file
  slurp:
    src: "{{ home_dir.stdout }}/{{ migration_config_dir }}/os_migrate_for_aap.yaml"
  register: migration_config_content
  when: migration_config_file.stat.exists

- name: Parse migration configuration
  set_fact:
    migration_extra_vars: "{{ (migration_config_content.content | b64decode) if migration_config_file.stat.exists else '' }}"

- name: Check if job template exists
  uri:
    url: "{{ aap_controller_url }}/api/v2/job_templates/?name=Windows%20VM%20Migration"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
    validate_certs: false
  register: existing_jt

- name: Create Job Template
  uri:
    url: "{{ aap_controller_url }}/api/v2/job_templates/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Windows VM Migration"
      description: "Migrate Windows VMs from VMware to RHOSO"
      job_type: "run"
      inventory: "{{ inventory_id }}"
      project: "{{ project_id }}"
      playbook: "playbooks/migration.yml"
      execution_environment: "{{ ee_id }}"
      extra_vars: "{{ migration_extra_vars }}"
      ask_variables_on_launch: true
    validate_certs: false
    status_code: [201]
  register: jt_result
  when: existing_jt.json.count == 0

- name: Set job template ID
  set_fact:
    jt_id: "{{ jt_result.json.id | default(existing_jt.json.results[0].id) }}"

# Associate credential with job template
- name: Associate credential with job template
  uri:
    url: "{{ aap_controller_url }}/api/v2/job_templates/{{ jt_id }}/credentials/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ credential_id }}"
    validate_certs: false
    status_code: [204, 200]
  ignore_errors: true

- name: Display final summary
  debug:
    msg: |
      ========================================
      ✅ AAP Configuration Complete!
      ========================================
      
      Created Resources:
      ├─ Credential: Bastion key (ID: {{ credential_id }})
      ├─ Inventory: Conversion Host Inventory (ID: {{ inventory_id }})
      │  ├─ Host: conversion_host ({{ rhoso_conversion_host_ip }})
      │  └─ Host: migrator (localhost)
      ├─ Execution Environment: ID {{ ee_id }}
      ├─ Project: vmware migration toolkit project (ID: {{ project_id }})
      └─ Job Template: Windows VM Migration (ID: {{ jt_id }})
      
      🎯 Next Steps:
      ========================================
      1. Access AAP Dashboard: {{ aap_controller_url }}
         - Username: admin
         - Password: {{ aap_admin_password }}
      
      2. Navigate to: Resources → Templates → "Windows VM Migration"
      
      3. Click "Launch" 🚀 to start the VM migration!
      ========================================
